[project]
name = "llm-canary-lab"
version = "0.2.0"
description = "Local Kubernetes lab for progressive LLM traffic shifting with Envoy Gateway, Agent Router and vllm-metal"
requires-python = ">=3.12"
dependencies = ["httpx>=0.27"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11"]

[tool.pytest.ini_options]
pythonpath = ["scripts"]
testpaths = ["tests"]

[tool.ruff]
line-length = 119
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["loadgen", "ramp"]

[tool.mypy]
strict = false
ignore_missing_imports = true
