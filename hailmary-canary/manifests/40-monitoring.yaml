apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata: {name: llm-backends, namespace: llm-test}
spec:
  selector: {matchLabels: {tier: llm-backend}}
  podTargetLabels: [app]
  podMetricsEndpoints:
  - {port: http, path: /metrics}
---
# Envoy pods are generated by Envoy Gateway, so match on its labels; 19001 is its admin metrics port
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata: {name: envoy-proxy, namespace: envoy-gateway-system}
spec:
  selector: {matchLabels: {app.kubernetes.io/name: envoy}}
  podMetricsEndpoints:
  - {portNumber: 19001, path: /stats/prometheus}
