# Latency differs per backend on purpose: the new cluster is slower so metrics can tell them apart.
# max-num-seqs is raised from the simulator default of 5, which would queue requests at modest concurrency.
# POD_NAME makes the simulator return an x-inference-pod header, which the load generator uses for attribution.
apiVersion: apps/v1
kind: Deployment
metadata: {name: llm-stable, namespace: llm-test, labels: {app: llm-stable, tier: llm-backend}}
spec:
  replicas: 2
  selector: {matchLabels: {app: llm-stable}}
  template:
    metadata: {labels: {app: llm-stable, tier: llm-backend}}
    spec:
      containers:
      - name: sim
        image: ghcr.io/llm-d/llm-d-inference-sim:v0.9.2
        args: ["--port=8000", "--model=test-model", "--time-to-first-token=200ms", "--inter-token-latency=20ms", "--max-num-seqs=64"]
        env:
        - name: POD_NAME
          valueFrom: {fieldRef: {fieldPath: metadata.name}}
        ports: [{name: http, containerPort: 8000}]
        readinessProbe: {tcpSocket: {port: http}}
        resources: {requests: {cpu: 50m, memory: 64Mi}}
---
apiVersion: v1
kind: Service
metadata: {name: llm-stable, namespace: llm-test, labels: {app: llm-stable}}
spec:
  selector: {app: llm-stable}
  ports: [{name: http, port: 8000, targetPort: http}]
---
